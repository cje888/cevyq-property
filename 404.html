<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening card</title>
<style>body{font:16px/1.5 Arial,sans-serif;background:#f3f6fb;color:#0d1628;text-align:center;padding:60px 16px}a{color:#2f7be0}</style>
<script>
  // Any wrong link (capital letters like /USA, a full stop or comma copied from a chat, a typo)
  // goes to the right card. Unknown links go to Malee's card.
  (function(){
    var known = {usa:"usa", us:"usa", america:"usa", sa:"sa", za:"sa", southafrica:"sa", aus:"aus", au:"aus", australia:"aus", dashboard:"dashboard", malee:"malee"};
    var first = (location.pathname.split("/")[1] || "").toLowerCase().replace(/[^a-z]/g, "");
    var to = known[first] || "malee";
    var rest = to === "dashboard" ? location.pathname.split("/").slice(2).join("/") : "";
    location.replace("/" + to + "/" + (rest && /^[\w.-]+$/.test(rest) ? rest : "") + location.search + location.hash);
  })();
</script>
</head>
<body>
<p>Opening the card&hellip; <a href="/malee/">tap here</a> if it does not open.</p>
<p><a href="https://www.cevyq.com">www.cevyq.com</a></p>
</body>
</html>
